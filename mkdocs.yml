site_name: IDV Open API
site_description: Dokumentasi Open API untuk integrasi transaksi, price list, product detail, callback, dan OtoMax
site_url: https://maulana222.github.io/Indosat-Digital-Voucher-IDV-/
repo_url: https://github.com/maulana222/Indosat-Digital-Voucher-IDV-
repo_name: maulana222/Indosat-Digital-Voucher-IDV-
edit_uri: ""

docs_dir: content
site_dir: site

theme:
  name: material
  language: id
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode terang
  font:
    text: DM Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/api

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: material/web
      link: https://maulana222.github.io/Indosat-Digital-Voucher-IDV-/
      name: Open API docs
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Beranda: index.md
  - Memulai: getting-started.md
  - Autentikasi: authentication.md
  - Transaksi: api/transaction.md
  - Price List: api/price-list.md
  - Product Detail: api/product-detail.md
  - Callback: api/callback.md
  - OtoMax: api/otomax.md
  - Status & RC: api/status-codes.md
